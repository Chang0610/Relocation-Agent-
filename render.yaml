services:
  - type: web
    name: shanghai-relocation-agent-demo
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -m py_compile backend/*.py
    startCommand: python backend/server.py
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_MODE
        value: "1"
